name: FAAR history bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/faar-history-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified recovery payload
        uses: actions/checkout@v4

      - name: Reconstruct and verify compact recovery payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .history-import/repair/r00.00 .history-import/repair/r00.01 .history-import/repair/r00.02 .history-import/repair/r00.03
            .history-import/payload.part01 .history-import/payload.part02 .history-import/payload.part03
            .history-import/repair/r04.00 .history-import/repair/r04.01 .history-import/repair/r04.02 .history-import/repair/r04.03
            .history-import/payload.part05 .history-import/payload.part06 .history-import/payload.part07 .history-import/payload.part08
            .history-import/payload.part09 .history-import/payload.part10
            .history-import/payload.part11a .history-import/payload.part11b
            .history-import/repair/r11c.00 .history-import/repair/r11c.01 .history-import/repair/r11c.02 .history-import/repair/r11c.03 .history-import/repair/r11c.04
          )
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/faar-payload.bin
          test "$(wc -c < /tmp/faar-payload.bin)" -eq 152263
          echo '34c81da4dc7eae96597fdce87f3d6611ca52f4f5ef3bbd8b3ac92477c5b60120  /tmp/faar-payload.bin' | sha256sum -c -

          head -c 112512 /tmp/faar-payload.bin > /tmp/faar-v021.bundle
          tail -c +112513 /tmp/faar-payload.bin > /tmp/faar-v03.diff.gz
          echo '36e80a854aab9643e37e79b42509d8f738866f96d68001e8bb70edd5c4202f21  /tmp/faar-v021.bundle' | sha256sum -c -
          echo 'e2fd82d7a52a55a98ffcf061bb4247c2feb590b83bfb4271d6933c60879dd422  /tmp/faar-v03.diff.gz' | sha256sum -c -
          git bundle verify /tmp/faar-v021.bundle

      - name: Rebuild ready v0.3 from v0.2.1
        shell: bash
        run: |
          set -euo pipefail
          git clone /tmp/faar-v021.bundle /tmp/faar-v021
          git clone /tmp/faar-v021.bundle /tmp/faar-v03
          cd /tmp/faar-v03
          git checkout -B v0.3/tcb-reduction 3b5d3a26ed6a4cec4868d1a88e31787199e7e0d8
          gzip -dc /tmp/faar-v03.diff.gz > /tmp/faar-v03.diff
          git apply --index /tmp/faar-v03.diff
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 28

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and run complete FAAR gate
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          cd /tmp/faar-v03
          python -m pip install --upgrade pip
          python -m pip install -e .
          make check
          PYTHONPATH=. python evals/model_check_permit_protocol.py
          git clean -fdx
          git diff --cached --check

      - name: Commit restored v0.2.1 baseline and ready v0.3 to main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Droptops'
          git config user.email '159727600+Droptops@users.noreply.github.com'

          # Preserve only this bootstrap workflow. Source history is copied without
          # .github so the Actions token never creates/updates a workflow file.
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/faar-v021/ ./
          git add -A -- ':!.github'
          git commit -m 'restore: FAAR v0.2.1 baseline'
          echo "FAAR_V021_RESTORED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/faar-v03/ ./
          git add -A -- ':!.github'
          git diff --cached --check
          git commit -m 'feat: harden FAAR v0.3 trusted execution boundary'
          echo "FAAR_V03_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish ready source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/main
          printf 'restored baseline: %s\nready v0.3: %s\n' "$FAAR_V021_RESTORED_SHA" "$FAAR_V03_SHA"
