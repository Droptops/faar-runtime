name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, declared dependencies, and schema tooling
        run: python -m pip install -e ".[dev]"
      - name: Full deterministic release gate
        run: make check

  postgres-store-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faar
          POSTGRES_PASSWORD: faar-ci-only
          POSTGRES_DB: faar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faar -d faar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FAAR_TEST_POSTGRES_DSN: postgresql://faar:faar-ci-only@127.0.0.1:5432/faar
      FAAR_TEST_POSTGRES_ALLOW_SCHEMA_DROP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL store dependencies
        run: python -m pip install -e ".[dev,postgres]"
      - name: PostgreSQL 16 store contract
        run: PYTHONPATH=test:. python -m unittest discover -s test -p 'test_postgres_store.py' -v
      - name: PostgreSQL-backed mapped red-team pass
        run: PYTHONPATH=. python evals/run_redteam.py
      - name: PostgreSQL-backed crash recovery sweep
        run: PYTHONPATH=. python evals/run_crash_injection.py
