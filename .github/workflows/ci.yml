name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and declared dependencies
        run: python -m pip install -e .
      - name: Full deterministic release gate
        run: make check
