[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faar-runtime"
version = "0.2.1"
description = "Financial Agent Authority Router — deterministic authority and economic execution runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "FAAR contributors"}]
keywords = ["agents", "authorization", "fintech", "trading", "security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
faar = "faar.cli:main"

[tool.setuptools]
packages = ["faar"]
